# GoReleaser configuration — invoked by go-semantic-release as a hook.
# The go-semantic-release/action in release.yml delegates build/release/formula push.
version: 2

project_name: nxconvert

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: nxconvert
    binary: nxconvert
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: nxconvert
    name_template: "nxconvert_{{ .Os }}_{{ .Arch }}"
    format: tar.gz

brews:
  - repository:
      owner: kyungw00k
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/kyungw00k/nxconvert"
    description: "Nintendo Switch game library builder (multi-source collector, SQLite index, HTML export)"
    # Public repo: plain release URLs, no download strategy needed.
    # The tap itself stays private, so pushing the formula still uses
    # HOMEBREW_TAP_GITHUB_TOKEN.

release:
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    ## 📦 Downloads

    - **macOS (arm64)**: `nxconvert_darwin_arm64.tar.gz`
    - **macOS (amd64)**: `nxconvert_darwin_amd64.tar.gz`
    - **Linux (arm64)**: `nxconvert_linux_arm64.tar.gz`
    - **Linux (amd64)**: `nxconvert_linux_amd64.tar.gz`

    ## 📋 Full Changelog

    See the [full changelog](https://github.com/kyungw00k/nxconvert/compare/{{ .PreviousTag }}...{{ .Tag }})

changelog:
  use: github-native

name: Release

# Automatic semantic versioning based on conventional commits.
# On push to main or manual dispatch, go-semantic-release determines the
# version from commit history and, when a new version is needed, invokes
# goreleaser to build/release/push the homebrew formula.
# No release is created when there are no changes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: goreleaser
          changelog-file: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Summary
        if: steps.semrel.outputs.version != ''
        run: |
          echo "### Released v${{ steps.semrel.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: v${{ steps.semrel.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- [Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.semrel.outputs.version }})" >> $GITHUB_STEP_SUMMARY
